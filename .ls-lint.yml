ls:
  .dir: regex:apps | regex:packages | regex:docs
  .md: kebab-case | regex:README | regex:CHANGELOG | regex:AGENTS | regex:STACK
  .{json,yaml,yml}: kebab-case

  # @ai: default-deny all code extensions in a single line
  .{js,jsx,ts,tsx,mjs,cjs,res,resi,astro,mdx,scss,less,txt,sh}: exists:0

  docs:
    .dir: kebab-case | regex:adr | regex:rfc | regex:notes | regex:stack
    .md: kebab-case
    "{adr,rfc,notes}/*":
      .dir: kebab-case
      .md: kebab-case
    stack:
      .dir: kebab-case
      .md: kebab-case
      "*":
        .dir: kebab-case
        .md: kebab-case
        "*":
          .dir: regex:trial | regex:approved | regex:forbidden
          .md: kebab-case

  apps:
    .dir: regex:main | regex:css-ui-docs

    main:
      .dir: kebab-case
      .{css,js,mjs,ts}: kebab-case | camelCase
      .tsx: PascalCase | kebab-case
      .{res,resi}: PascalCase | camelCase

    css-ui-docs:
      .dir: kebab-case
      .{md,mdx}: kebab-case
      .{astro,tsx,jsx}: PascalCase | kebab-case
      .{res,resi}: PascalCase | camelCase
      .{js,mjs,css,ts}: kebab-case | camelCase

  packages:
    .dir: regex:styles
    styles:
      .dir: kebab-case
      .css: kebab-case

ignore:
  - .git
  - node_modules
  - dist
  - build
  - .astro
  - .turbo
  - pnpm-lock.yaml
  - .github
